name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  release:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from branch name
        id: version
        # head.ref is user-controllable input: keep it in env (data) instead of
        # interpolating it into the script (code), and validate the version
        # shape before it reaches tags and image names.
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${BRANCH#release/}"
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Branch '$BRANCH' does not contain a valid semver version"
            exit 1
          fi
          IMAGE_NAME=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "semver=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Check tag does not already exist
        env:
          TAG: ${{ steps.version.outputs.tag }}
        # The checkout is shallow and tagless, so query the remote directly.
        run: |
          if git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists. Skipping duplicate release."
            exit 1
          fi

      - name: Extract changelog entry
        id: changelog
        env:
          SEMVER: ${{ steps.version.outputs.semver }}
        run: |
          NOTES=$(awk -v ver="$SEMVER" '
            BEGIN { gsub(/\./, "\\.", ver) }
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            /^## \[/ { if (found) exit }
            found
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "::error::No changelog entry found for version $SEMVER in CHANGELOG.md"
            exit 1
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          # Passed through env so backticks/$() in changelog text are data,
          # not shell syntax (v0.5.0 notes were corrupted by interpolation).
          NOTES: ${{ steps.changelog.outputs.notes }}
        run: |
          gh release create "$TAG" \
            --title "Release $TAG" \
            --notes "$NOTES"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ steps.version.outputs.image }}:${{ steps.version.outputs.semver }}
            ${{ env.REGISTRY }}/${{ steps.version.outputs.image }}:latest
