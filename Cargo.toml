[package]
name = "ghostty-mcp"
version = "0.5.0"
edition = "2021"
description = "MCP server for Ghostty terminal configuration"
license = "MIT"
repository = "https://github.com/daniFloresR/ghostty-mcp"
authors = ["Dani Flores"]
keywords = ["mcp", "ghostty", "terminal", "configuration"]

[dependencies]
rmcp = { version = "0.16", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
nucleo-matcher = "0.3"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
