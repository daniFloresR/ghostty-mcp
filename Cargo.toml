[package]
name = "ghostty-mcp"
version = "0.5.1"
edition = "2021"
rust-version = "1.88"
description = "MCP server for Ghostty terminal configuration"
license = "MIT"
repository = "https://github.com/daniFloresR/ghostty-mcp"
authors = ["Dani Flores"]
keywords = ["mcp", "ghostty", "terminal", "configuration"]

[dependencies]
rmcp = { version = "1.7", features = ["server", "transport-io", "macros"] }
# Only the runtime and the #[tokio::main] macro are used directly; rmcp's
# transport-io feature pulls the tokio I/O features it needs itself.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
nucleo-matcher = "0.3"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
# No unwinding needed: a panic in a stdio MCP server kills the transport
# either way, and abort drops the landing-pad code from the binary.
panic = "abort"
